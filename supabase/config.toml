# Supabase CLI config for LOCAL development (`npx supabase start`). Hosted projects are configured in the dashboard:
# see README "Production setup". NOTE: this file was written from the CLI docs and has not been exercised in this repo's CI.
project_id = "scholaros"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[storage]
enabled = true

[storage.buckets.manuscripts]
public = false
file_size_limit = "10MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Confirm your ScholarOS email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your ScholarOS password"
content_path = "./supabase/templates/recovery.html"
